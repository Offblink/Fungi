name: CI

# pytest is the gate. Ruff (check only, never format) runs against the version
# pinned in pyproject's dev extra: a ruff release that changes a rule must not be
# able to redden an untouched tree. The tree is check-clean as of 2026-09-10, so
# this is a whole-tree check — no changed-files diff to get subtly wrong.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow
          # ruff + playwright versions live in pyproject's dev extra (one place)
          $pins = Select-String -Path pyproject.toml -Pattern '(ruff|playwright)==[0-9.]+' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Value } | Select-Object -Unique
          $pins | Set-Content -Path pins.txt
          python -m pip install -r pins.txt
          # The web UI tests (tests/test_webui_friend.py) drive a real browser:
          # two rooms, the room's own WebUI server, and what the page paints.
          python -m playwright install chromium

      # GUI/tray tests call pytest.importorskip on qfluentwidgets/PyQt5, which is
      # not installed here — they skip gracefully; everything else is stdlib.
      - name: Lint
        run: python -m ruff check

      - name: Run tests
        run: python -m pytest tests -q
