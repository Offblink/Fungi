name: CI

# pytest is the gate. Ruff (check only, never format) runs against the version
# pinned in pyproject's dev extra: a ruff release that changes a rule must not be
# able to redden an untouched tree. The tree is check-clean as of 2026-09-10, so
# this is a whole-tree check — no changed-files diff to get subtly wrong.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow
          # the ruff pin lives in pyproject [dev] — read it instead of repeating it here
          python -c "import pathlib,re;print(re.search(r'ruff==[0-9.]+',pathlib.Path('pyproject.toml').read_text('utf-8')).group(0))" > pin.txt
          python -m pip install -r pin.txt

      # GUI/tray tests call pytest.importorskip on qfluentwidgets/PyQt5, which is
      # not installed here — they skip gracefully; everything else is stdlib.
      # The web tests need playwright + a browser and skip the same way.
      - name: Lint
        run: python -m ruff check

      - name: Run tests
        run: python -m pytest tests -q
