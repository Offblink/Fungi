name: CI

# pytest is the only CI gate. Ruff stays a local-only gate (scripts/check.ps1):
# the last ruff version the tree formatted clean with is unknown — 0.15.15
# reports 23 check errors / 14 reformats, 0.11–0.13 all report 16 reformats,
# 0.8.6/0.9.0 were never confirmed. Do not add a ruff step until the tree is
# reformatted against a pinned version and committed intentionally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # GUI/tray tests call pytest.importorskip on qfluentwidgets/PyQt6, which is
      # not installed here — they skip gracefully; everything else is stdlib.
      - name: Run tests
        run: python -m pytest tests -q
