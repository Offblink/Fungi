name: Release

# Tag a release: git tag vX.Y.Z && git push origin vX.Y.Z
# (push: sleep 3 -> git -c http.proxy=http://127.0.0.1:7897 push origin vX.Y.Z)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install pytest PyQt5 PyQt-Fluent-Widgets pyinstaller

      # Same gate as CI (pytest only — see ci.yml for the ruff drift note).
      - name: Run tests
        run: python -m pytest tests -q

      # Tracked files only: config.json (real API key) is gitignored, so it
      # never enters the archive.
      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          name="fungi-${GITHUB_REF_NAME}-source.zip"
          git archive --format=zip --prefix="fungi-${GITHUB_REF_NAME#v}/" -o "$name" HEAD
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"
      # GUI exe (PyInstaller, onedir): web/ static assets ride along via
      # --add-data; fungi/config.py resolves user data next to the exe when
      # frozen. Foreign Qt bindings are excluded so hooks never collide.
      - name: Build Windows exe
        run: >
          python -m PyInstaller --noconfirm --noconsole --name Fungi start.py
          --icon assets/fungi.ico
          --add-data "web;web" --collect-all qfluentwidgets
          --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6
          --exclude-module shiboken2 --exclude-module shiboken6

      - name: Zip exe bundle
        shell: pwsh
        run: Compress-Archive -Path dist/Fungi -DestinationPath "fungi-$($env:GITHUB_REF_NAME)-windows-x64.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            fungi-v*-windows-x64.zip
          generate_release_notes: true
